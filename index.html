<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>My Blog</title>
    </head>
    <body>
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="blog-title">✨ Mufazzel Hossain</h1>
                <p class="blog-subtitle">Sharing Knowledge & Experience</p>
            </div>
        </header>

        <!-- Main Container -->
        <div class="container">
            <!-- Sidebar with Categories -->
            <aside class="sidebar">
                <h3>📚 Categories</h3>
                <div class="categories">
                    <button class="category-btn active" data-category="all">All Posts</button>
                    <button class="category-btn" data-category="technology">💻 Technology</button>
                    <button class="category-btn" data-category="lifestyle">🏃 Lifestyle</button>
                    <button class="category-btn" data-category="travel">✈️ Travel</button>
                    <button class="category-btn" data-category="food">🍝 Food</button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="main-content">
                <div class="posts-container" id="postsContainer">
                    <!-- Blog posts will be loaded here dynamically -->
                </div>
            </main>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 My Blog. All rights reserved.</p>
        </footer>

        <!-- Details Modal -->
        <div class="modal" id="detailsModal">
            <div class="modal-overlay" id="modalOverlay"></div>
            <div class="modal-content">
                <button class="close-btn" id="closeBtn">&times;</button>
                <div class="modal-body">
                    <div class="detail-header">
                        <div class="detail-icon" id="detailIcon"></div>
                        <h1 id="detailTitle"></h1>
                        <div class="detail-meta">
                            <span class="detail-category" id="detailCategory"></span>
                            <span class="detail-date" id="detailDate"></span>
                        </div>
                    </div>
                    <div class="detail-body" id="detailContent"></div>
                    <div class="detail-footer">
                        <button class="back-btn" id="backBtn">← Back to Posts</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
